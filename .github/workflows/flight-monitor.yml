name: Flight Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-flights:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flight check
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          MAILING_LIST: ${{ secrets.MAILING_LIST }}
        run: python main.py --run-once

      - name: Persist tracked flight data
        run: |
          git config user.name "flight-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f flights_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update tracked flights data [skip ci]"
            git push
          fi
