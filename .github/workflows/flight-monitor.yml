# Triggered every 15 minutes by an external cron-job.org ping to the
# workflow_dispatch API; GitHub's own schedule trigger is intentionally
# not used here to avoid duplicate/overlapping runs.
name: Flight Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-flights:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flight check
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          MAILING_LIST: ${{ secrets.MAILING_LIST }}
        run: |
          set -o pipefail
          python main.py --run-once 2>&1 | tee run_output.log
          if grep -q "ERROR" run_output.log; then
            echo "Errors were logged during the flight check"
            exit 1
          fi

      - name: Persist tracked flight data
        run: |
          git config user.name "flight-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f flights_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update tracked flights data [skip ci]"
            for i in 1 2 3 4 5; do
              git push && break
              git pull --rebase origin main
            done
          fi

      - name: Notify on failure
        if: failure()
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
        run: |
          python - <<'EOF'
          import os
          import smtplib
          import ssl
          from email.mime.text import MIMEText

          server = os.environ["EMAIL_SMTP_SERVER"]
          port = int(os.environ["EMAIL_SMTP_PORT"])
          username = os.environ["EMAIL_USERNAME"]
          password = os.environ["EMAIL_PASSWORD"]

          run_url = "{}/{}/actions/runs/{}".format(
              os.environ["GITHUB_SERVER_URL"],
              os.environ["GITHUB_REPOSITORY"],
              os.environ["GITHUB_RUN_ID"],
          )

          body = "The TusTus flight monitor run failed.\n\nSee logs: {}".format(run_url)
          msg = MIMEText(body)
          msg["Subject"] = "TusTus Flight Monitor - Run Failed"
          msg["From"] = username
          msg["To"] = username

          context = ssl.create_default_context()
          with smtplib.SMTP(server, port) as smtp:
              smtp.starttls(context=context)
              smtp.login(username, password)
              smtp.sendmail(username, [username], msg.as_string())
          EOF
